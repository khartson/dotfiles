# Single toolchain for Linux laptops, Proxmox SSH boxes, devcontainers, and
# Windows (pwsh). chezmoi re-runs `mise install` whenever this file changes.
# Update:  mise upgrade

[tools]
node = "24"
python = "3.13"
ruby = "3.3"

kubectl = "latest"
helm = "latest"
argocd = "latest"
talos = "latest"
terraform = "latest"
starship = "latest"
chezmoi = "latest"
"npm:@sentry/dotagents" = "latest"

[settings]
experimental = true
# Prefer prebuilt CPython when mise has one; avoids compiling on lean SSH boxes.
python.compile = false

[settings.npm]
# npm: tools install with embedded aube, not npm -g. Dependency lifecycle
# scripts stay denied unless a tool sets allow_builds.
package_manager = "aube"
